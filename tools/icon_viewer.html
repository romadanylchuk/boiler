<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>U8g2 Open Iconic — Glyph Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic.min.css">
<style>
  body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 20px; }
  h1   { color: #7af; margin-bottom: 4px; }
  p    { color: #aaa; margin: 0 0 16px; font-size: 13px; }
  input {
    width: 300px; padding: 6px 10px; margin-bottom: 16px;
    background: #333; border: 1px solid #555; color: #eee;
    border-radius: 4px; font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .card {
    background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
    padding: 10px 8px; text-align: center; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .card:hover   { background: #3a3a3a; border-color: #7af; }
  .card.copied  { border-color: #7f7; background: #1a2e1a; }
  .oi           { font-size: 24px; color: #7af; display: block; margin-bottom: 6px; }
  .code         { font-size: 13px; color: #f90; font-weight: bold; }
  .name         { font-size: 10px; color: #888; margin-top: 3px; word-break: break-all; }
  .hidden       { display: none; }
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #333; border: 1px solid #7f7; color: #7f7;
    padding: 8px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>U8g2 Open Iconic — Glyph Viewer</h1>
<p>
  Font: <code>u8g2_font_open_iconic_all_1x_t</code> &nbsp;|&nbsp;
  Codes start at <strong>64</strong> &nbsp;|&nbsp;
  Click any card to copy the glyph code number.
</p>

<input type="text" id="search" placeholder="Search icon name…" oninput="filterCards()" autofocus>

<div class="grid" id="grid"></div>
<div id="toast">Copied!</div>

<script>
// All 223 Open Iconic icons in alphabetical order (U8g2 glyph = index + 64)
const icons = [
  "account-login","account-logout","action-redo","action-undo","align-center",
  "align-left","align-right","aperture","arrow-bottom","arrow-circle-bottom",
  "arrow-circle-left","arrow-circle-right","arrow-circle-top","arrow-left",
  "arrow-right","arrow-thick-bottom","arrow-thick-left","arrow-thick-right",
  "arrow-thick-top","arrow-top","audio-spectrum","audio","badge","ban",
  "bar-chart","basket","battery-empty","battery-full","beaker","bell","bluetooth",
  "bold","bolt","book","bookmark","box","briefcase","british-pound","browser",
  "bug","bullhorn","calculator","calendar","camera-slr","caret-bottom",
  "caret-left","caret-right","caret-top","cart","chat","check","chevron-bottom",
  "chevron-left","chevron-right","chevron-top","circle-check","circle-x",
  "clipboard","clock","cloud-download","cloud-upload","cloud","code","cog",
  "collapse-down","collapse-left","collapse-right","collapse-up","command",
  "comment-square","compass","contrast","copywriting","credit-card","crop",
  "dashboard","data-transfer-download","data-transfer-upload","delete","dial",
  "document","dollar","double-quote-sans-left","double-quote-sans-right",
  "double-quote-serif-left","double-quote-serif-right","droplet","eject",
  "elevator","ellipsis","envelope-closed","envelope-open","euro","excerpt",
  "expander","external-link","eye","eyedropper","file","fire","flag","flash",
  "folder","fork","fullscreen-enter","fullscreen-exit","globe","graph",
  "grid-four-up","grid-three-up","grid-two-up","hard-drive","header",
  "headphones","heart","home","image","inbox","infinity","info","italic",
  "justify-center","justify-left","justify-right","key","laptop","layers",
  "lightbulb","link-broken","link-intact","list-rich","list","location",
  "lock-locked","lock-unlocked","loop-circular","loop-square","loop",
  "magnifying-glass","map-marker","map","media-pause","media-play",
  "media-record","media-skip-backward","media-skip-forward","media-step-backward",
  "media-step-forward","media-stop","medical-cross","menu","microphone","minus",
  "monitor","moon","move","musical-note","paperclip","pencil","people","person",
  "phone","pie-chart","pin","play-circle","plus","power-standby","print",
  "project","pulse","puzzle-piece","question-mark","rain","random","reload",
  "resize-both","resize-height","resize-width","rss-alt","rss","script",
  "share-boxed","share","shield","signal","size-actual","size-fullscreen",
  "skill-level-advanced","skill-level-basic","skill-level-intermediate",
  "sort-ascending","sort-descending","spreadsheet","star","sun","tag","task",
  "terminal","text","thumb-down","thumb-up","timer","transfer","trash",
  "underline","vertical-align-bottom","vertical-align-center","vertical-align-top",
  "video","volume-high","volume-low","volume-off","warning","wifi","wrench",
  "x","yen","zoom-in","zoom-out"
];

const grid = document.getElementById('grid');

icons.forEach((name, i) => {
  const code = i + 64;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = name;
  card.innerHTML = `
    <span class="oi" data-glyph="${name}"></span>
    <div class="code">${code}</div>
    <div class="name">${name}</div>
  `;
  card.addEventListener('click', () => {
    navigator.clipboard.writeText(String(code)).then(() => {
      card.classList.add('copied');
      setTimeout(() => card.classList.remove('copied'), 800);
      showToast(`Copied ${code} (${name})`);
    });
  });
  grid.appendChild(card);
});

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('hidden', !c.dataset.name.includes(q));
  });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
